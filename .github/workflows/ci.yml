name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      VITE_API_TARGET: http://localhost:3000
    defaults:
      run:
        working-directory: react/job-applicants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/job-applicants/package-lock.json
      - run: npm ci
      - run: npm run build -w api
      - run: npm run typecheck
      - run: npm run build -w web
      - run: npm run test:run -w web
